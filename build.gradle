plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

base {
	archivesName = "RotaryCraft-${project.minecraft_version}"
}

version = project.mod_version
group = project.group

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			gameDirectory = project.file('run')
			programArguments.addAll('--width', '854', '--height', '480')
			// -Pautotest=<script> drives the client from a script (needs the Cortex test harness in run/mods)
			if (findProperty('autotest')) {
				jvmArguments.add("-Dcortex.autotest=${findProperty('autotest')}")
			}
		}
		server {
			server()
			gameDirectory = project.file('run-server')
			programArgument '--nogui'
		}
		// Headless dedicated-server boot + GameTests (NeoForge auto-accepts the EULA for gametest servers)
		gameTestServer {
			type = 'gameTestServer'
			gameDirectory = project.file('run-gametest')
			systemProperty 'neoforge.enabledGameTestNamespaces', 'rotarycraft'
		}
	}

	mods {
		rotarycraft {
			sourceSet sourceSets.main
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

processResources {
	def props = [mod_id: project.mod_id, mod_name: project.mod_name, mod_version: project.mod_version,
	             mod_license: project.mod_license, mod_authors: project.mod_authors]
	inputs.properties props
	filesMatching('META-INF/neoforge.mods.toml') {
		expand props
	}
}

repositories {
	exclusiveContent {
		forRepository { maven { url = 'https://maven.blamejared.com' } }
		filter { includeGroup 'mezz.jei' }
	}
	exclusiveContent {
		forRepository { maven { url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

configurations {
	// dev-run-only mods; not exposed to anything that depends on this project
	localRuntime
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	// optional integrations: JEI pages and Jade tooltips for the machines (neither is needed to play)
	compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
	localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
	compileOnly "maven.modrinth:jade:${jade_version}"
	localRuntime "maven.modrinth:jade:${jade_version}"
}
